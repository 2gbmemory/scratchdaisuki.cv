<script>
function randomTime() {
  const types = ["秒", "分", "時間", "日"];
  const type = types[Math.floor(Math.random() * types.length)];

  let num;
  if (type === "秒") num = Math.floor(Math.random() * 60);
  if (type === "分") num = Math.floor(Math.random() * 60);
  if (type === "時間") num = Math.floor(Math.random() * 24);
  if (type === "日") num = Math.floor(Math.random() * 365);

  return `${num}${type}前に参加`;
}

setInterval(() => {
  document.getElementById("joinedText").textContent = randomTime();
}, 100);
</script>
